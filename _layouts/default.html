<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Dinamis Title -->
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">

    <!-- === OPEN GRAPH META TAGS (Untuk WA, FB, Telegram, dll) === -->
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:type" content="{% if page.url contains '/posts/' %}article{% else %}website{% endif %}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
    <meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    
    <!-- Logika Gambar: Ambil gambar dari post (jika ada), jika tidak ambil default -->
    {% if page.image %}
        <meta property="og:image" content="{{ site.url }}{{ page.image }}">
    {% else %}
        <meta property="og:image" content="{{ site.url }}{{ site.image }}">
    {% endif %}

    <!-- === TWITTER CARDS (Untuk preview di X/Twitter) === -->
    <!-- Pakai summary_large_image agar gambar tampil besar seperti di screenshot -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@{{ site.twitter_username }}">
    <meta name="twitter:creator" content="@{{ site.twitter_username }}">
    <meta name="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
    <meta name="twitter:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
    {% if page.image %}
        <meta name="twitter:image" content="{{ site.url }}{{ page.image }}">
    {% else %}
        <meta name="twitter:image" content="{{ site.url }}{{ site.image }}">
    {% endif %}

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    <div class="terminal-container">
        <header class="terminal-header">
            <div class="top-bar">
                <div class="mac-controls">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
                <div class="title">0xrwise</div>
            </div>
            
            <nav class="tabs">
                <a href="/" class="active"><i class="fa-solid fa-terminal"></i> HOME</a>
                <a href="/posts"><i class="fa-solid fa-folder-open"></i> POST</a>
                <a href="/cv"><i class="fa-solid fa-user-tie"></i> CV</a>
                
                {% if page.url == '/posts/' %}
                <a href="#" style="margin-left: auto; border-right: none;" title="Search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </a>
                {% endif %}
            </nav>
        </header>

        <main class="terminal-content" id="terminal-scroll">
            {{ content }}
        </main>
    </div>

    <script src="{{ '/assets/js/terminal.js' | relative_url }}"></script>
</body>
</html>
