<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0xrwise | Independent Reasearch</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    <div class="terminal-container">
        <header class="terminal-header">
            <div class="top-bar">
                <div class="mac-controls">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
                <div class="title">0xrwise</div>
            </div>
            
            <nav class="tabs">
                <a href="/" class="active"><i class="fa-solid fa-terminal"></i> HOME</a>
                <a href="/posts"><i class="fa-solid fa-folder-open"></i> POST</a>
                <a href="/cv"><i class="fa-solid fa-user-tie"></i> CV</a>
                
                <!-- Tombol Search Keren di Pojok Kanan -->
                <a href="#" style="margin-left: auto; border-right: none;" title="Search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </a>
            </nav>
        </header>

        <main class="terminal-content" id="terminal-scroll">
            {{ content }}
        </main>
    </div>

    <script src="{{ '/assets/js/terminal.js' | relative_url }}"></script>
</body>
</html>
